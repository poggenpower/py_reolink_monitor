poll_interval_seconds: 300
recent_recordings_lookback_minutes: 1440
discovery_prefix: homeassistant
state_prefix: reolink_monitor

mqtt:
  host: "${MQTT_HOST}"
  port: "${MQTT_PORT}"
  username: "${MQTT_USERNAME}"
  password: "${MQTT_PASSWORD}"
  client_id: reolink_monitor
  # Enable verified TLS; certificate verification is enabled by default.
  tls: false
  # Set one of these to a PEM broker certificate or CA certificate.
  # Paths are relative to this config file when not absolute.
  # server_cert: certs/mqtt-server.pem
  # ca_cert: certs/mqtt-ca.pem

cameras:
  - name: Garden Camera
    host: "${CAMERA_HOST}"
    username: "${CAMERA_USERNAME}"
    password: "${CAMERA_PASSWORD}"
    port: 9000
    channel: 0
    # Enable Baichuan UDP with a fixed local port (1-65535).
    # udp: true
    # udp_local_port: 44230
