[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reolink-monitor"
version = "0.1.0"
description = "Monitor Reolink cameras and publish their status to MQTT."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "reolink-aio>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.6",
]

[project.scripts]
reolink-monitor = "reolink_monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
